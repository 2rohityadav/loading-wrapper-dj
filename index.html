<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Playwright Site Wrapper</title>
  <style>
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="myFrame" src="/my-local-copy.html"></iframe>

  <script>
  const iframe = document.getElementById('myFrame');
  iframe.onload = () => {
    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    const nav = iframeDoc.querySelector('nav[aria-label="Main"]');
    if (nav) {
      nav.remove();
      console.log("✅ Navbar removed.");
    }
  };
</script>
</body>
</html>
